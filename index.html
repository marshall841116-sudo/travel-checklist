    <!-- PeerJS WebRTC Realtime Sync Library -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <script>
        // Optimized Multi-Device & Multi-Tab Realtime Syncing Controller
        let peer = null;
        let activeConns = [];

        window.cloudSync = {
            currentRoomId: null,

            subscribeRoom: function(roomId, onDataUpdate) {
                this.leaveRoom();
                this.currentRoomId = roomId;

                // 隨機產生獨立 Peer ID，避免 ID 衝突
                const myPeerId = 'pack_' + roomId + '_' + Math.random().toString(36).substring(2, 9);
                const hostPeerId = 'pack_host_' + roomId;

                peer = new Peer(hostPeerId);

                peer.on('open', (id) => {
                    console.log('連線成功 (Host 房主):', id);
                });

                peer.on('error', (err) => {
                    // 若 Host ID 已被佔用，則自動作為 Client 參加者加入
                    if (err.type === 'unavailable-id' || err.type === 'peer-unavailable') {
                        peer = new Peer(myPeerId);
                        peer.on('open', () => {
                            console.log('連線成功 (Client 參加者):', myPeerId);
                            const conn = peer.connect(hostPeerId);
                            this.setupConn(conn, onDataUpdate);
                        });
                    }
                });

                peer.on('connection', (conn) => {
                    this.setupConn(conn, onDataUpdate);
                    // 新人進房，廣播最新資料
                    setTimeout(() => {
                        if (window.getPackingData) {
                            conn.send({ type: 'SYNC_DATA', data: window.getPackingData() });
                        }
                    }, 500);
                });
            },

            setupConn: function(conn, onDataUpdate) {
                activeConns.push(conn);

                conn.on('data', (res) => {
                    if (res && res.type === 'SYNC_DATA' && res.data) {
                        onDataUpdate(res.data);
                    }
                });

                conn.on('close', () => {
                    activeConns = activeConns.filter(c => c !== conn);
                });
            },

            uploadData: function(data) {
                if (!this.currentRoomId) return;
                activeConns.forEach(conn => {
                    if (conn.open) {
                        conn.send({ type: 'SYNC_DATA', data: data });
                    }
                });
            },

            leaveRoom: function() {
                activeConns.forEach(c => c.close());
                activeConns = [];
                if (peer) {
                    peer.destroy();
                    peer = null;
                }
                this.currentRoomId = null;
            }
        };
    </script>

                ]
            }

        // State variables
        let currentMode = 'domestic';
        let currentRoomId = null;
        let isSyncingFromCloud = false;

        let packingData = {
            domestic: [],
            foreign: []
        };

        window.getPackingData = function() {
            return packingData;
        };

        window.onload = function() {
            loadFromLocalStorage();
            switchMode(currentMode);

            // 自動檢查網址參數 ?room= 或是上一回合儲存的房間代碼
            const urlParams = new URLSearchParams(window.location.search);
            const roomFromUrl = urlParams.get('room');
            const savedRoomId = localStorage.getItem('travel_packing_room_id');

            const targetRoom = roomFromUrl || savedRoomId;
            if (targetRoom) {
                joinRoom(targetRoom, false);
            }
        };

        function saveToLocalStorage() {
            localStorage.setItem('travel_packing_data_v1', JSON.stringify(packingData));
            localStorage.setItem('travel_packing_mode_v1', currentMode);

            if (currentRoomId) {
                localStorage.setItem('travel_packing_room_id', currentRoomId);
            } else {
                localStorage.removeItem('travel_packing_room_id');
            }

            // 強制雲端同步最新勾選/刪除狀態
            if (currentRoomId && window.cloudSync && !isSyncingFromCloud) {
                window.cloudSync.uploadData(packingData);
            }
        }

        function loadFromLocalStorage() {
            const savedData = localStorage.getItem('travel_packing_data_v1');
            const savedMode = localStorage.getItem('travel_packing_mode_v1');

            if (savedData) {
                try {
                    packingData = JSON.parse(savedData);
                } catch (e) {
                    console.error("Failed to parse localStorage data", e);
                    initDefaultData();
                }
            } else {
                initDefaultData();
            }

            if (savedMode && (savedMode === 'domestic' || savedMode === 'foreign')) {
                currentMode = savedMode;
            }
        }

        function openShareModal() {
            document.getElementById('share-modal').classList.remove('hidden');
            updateRoomUI();
        }

        function closeShareModal() {
            document.getElementById('share-modal').classList.add('hidden');
        }

        function joinRoomFromInput() {
            const input = document.getElementById('room-code-input');
            const code = input ? input.value.trim() : '';
            if (!code) {
                showToast('請輸入房間代碼！', 'warning');
                return;
            }
            joinRoom(code, true);
        }

        function joinRoom(roomId, showNotification = true) {
            currentRoomId = roomId;
            localStorage.setItem('travel_packing_room_id', roomId);

            // 更新網址參數 (不重新整理頁面)
            const url = new URL(window.location.href);
            url.searchParams.set('room', roomId);
            window.history.replaceState({}, '', url.href);

            updateRoomUI();

            if (window.cloudSync) {
                window.cloudSync.subscribeRoom(roomId, (remoteData) => {
                    isSyncingFromCloud = true;
                    packingData = remoteData;
                    localStorage.setItem('travel_packing_data_v1', JSON.stringify(packingData));
                    renderList();
                    updateCategoryDropdown();
                    isSyncingFromCloud = false;
                });
            }

            if (showNotification) {
                showToast(`已成功連線至共編房間「${roomId}」`, 'success');
                closeShareModal();
            }
        }

        function leaveRoom() {
            if (window.cloudSync) {
                window.cloudSync.leaveRoom();
            }
            currentRoomId = null;
            localStorage.removeItem('travel_packing_room_id');

            // 移除網址中的 room 參數
            const url = new URL(window.location.href);
            url.searchParams.delete('room');
            window.history.replaceState({}, '', url.href);

            updateRoomUI();
            showToast('已切回單機模式', 'info');
            closeShareModal();
        }

        function copyShareLink() {
            if (!currentRoomId) return;
            const url = new URL(window.location.href);
            url.searchParams.set('room', currentRoomId);
            
            const shareUrl = url.href;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showToast('已複製多人邀請連結！', 'success');
                }).catch(() => {
                    fallbackCopyText(shareUrl);
                });
            } else {
                fallbackCopyText(shareUrl);
            }
        }

        function fallbackCopyText(text) {
            const dummy = document.createElement('input');
            document.body.appendChild(dummy);
            dummy.value = text;
            dummy.select();
            dummy.setSelectionRange(0, 99999);
            document.execCommand('copy');
            document.body.removeChild(dummy);
            showToast('已複製多人邀請連結！', 'success');
        }

        function updateRoomUI() {
            const roomBadgeText = document.getElementById('room-badge-text');
            const activeRoomBox = document.getElementById('active-room-box');
            const currentRoomDisplay = document.getElementById('current-room-display');

            if (currentRoomId) {
                roomBadgeText.innerText = `房間: ${currentRoomId}`;
                document.getElementById('room-badge').className = "inline-flex items-center space-x-1 px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 text-xs font-semibold border border-emerald-200 animate-pulse";
                if (activeRoomBox) activeRoomBox.classList.remove('hidden');
                if (currentRoomDisplay) currentRoomDisplay.innerText = currentRoomId;
            } else {
                roomBadgeText.innerText = "單機個人版";
                document.getElementById('room-badge').className = "inline-flex items-center space-x-1 px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 text-xs font-semibold border border-amber-200";
                if (activeRoomBox) activeRoomBox.classList.add('hidden');
            }
        }

        function initDefaultData() {
            packingData.domestic = JSON.parse(JSON.stringify(defaultDomesticList));
            packingData.foreign = JSON.parse(JSON.stringify(defaultForeignList));
            saveToLocalStorage();
        }

        function switchMode(mode) {
            currentMode = mode;
            saveToLocalStorage();

            const domTab = document.getElementById('tab-domestic');
            const forTab = document.getElementById('tab-foreign');
            const modeBadgeText = document.getElementById('mode-badge-text');

            if (mode === 'domestic') {
                domTab.className = "flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-semibold bg-white text-brand-600 shadow-sm transition-all duration-200";
                forTab.className = "flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium text-slate-500 hover:text-slate-800 transition-all duration-200";
                modeBadgeText.innerText = "國內旅遊模式";
            } else {
                forTab.className = "flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-semibold bg-white text-teal-600 shadow-sm transition-all duration-200";
                domTab.className = "flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium text-slate-500 hover:text-slate-800 transition-all duration-200";
                modeBadgeText.innerText = "國外旅遊模式";
            }

            updateCategoryDropdown();
            renderList();
        }

        function updateCategoryDropdown() {
            const select = document.getElementById('add-item-category');
            if (!select) return;
            select.innerHTML = '';

            const currentList = packingData[currentMode] || [];
            if (currentList.length === 0) {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = '-- 請先新增分類 --';
                select.appendChild(option);
                return;
            }

            currentList.forEach((catGroup) => {
                const option = document.createElement('option');
                option.value = catGroup.category;
                option.textContent = catGroup.category;
                select.appendChild(option);
            });
        }

        function toggleItem(itemId) {
            const currentList = packingData[currentMode];
            for (let cat of currentList) {
                const item = cat.items.find(i => i.id === itemId);
                if (item) {
                    item.checked = !item.checked;
                    break;
                }
            }
            saveToLocalStorage();
            renderList();
        }

        function addNewItem() {
            const select = document.getElementById('add-item-category');
            const input = document.getElementById('add-item-input');

            if (!select || !input) return;

            const categoryName = select.value;
            const itemName = input.value.trim();

            if (!categoryName) {
                showToast('請先新增或選擇分類！', 'warning');
                return;
            }

            if (!itemName) {
                showToast('請輸入物品名稱！', 'warning');
                return;
            }

            const currentList = packingData[currentMode];
            const targetCategory = currentList.find(c => c.category === categoryName);

            if (targetCategory) {
                const newItemId = 'custom_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
                targetCategory.items.push({
                    id: newItemId,
                    name: itemName,
                    checked: false
                });

                input.value = '';
                saveToLocalStorage();
                renderList();
                showToast(`已新增「${itemName}」至【${categoryName}】`, 'success');
            }
        }

        function deleteItem(itemId) {
            const currentList = packingData[currentMode];
            let deletedName = '';

            for (let cat of currentList) {
                const idx = cat.items.findIndex(i => i.id === itemId);
                if (idx !== -1) {
                    deletedName = cat.items[idx].name;
                    cat.items.splice(idx, 1);
                    break;
                }
            }

            saveToLocalStorage();
            renderList();
            if (deletedName) {
                showToast(`已刪除「${deletedName}」`, 'info');
            }
        }

        function renderList() {
            const container = document.getElementById('categories-container');
            if (!container) return;
            container.innerHTML = '';

            const currentList = packingData[currentMode] || [];

            let totalItems = 0;
            let checkedItems = 0;

            if (currentList.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-12 text-center text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200">
                        <i class="fa-solid fa-folder-open text-4xl mb-3 text-slate-300"></i>
                        <p class="text-sm font-medium">目前尚無任何分類，請點擊上方「+ 新增全新型態分類」</p>
                    </div>
                `;
            }

            currentList.forEach((catGroup, catIdx) => {
                const catTotal = catGroup.items.length;
                const catChecked = catGroup.items.filter(i => i.checked).length;
                
                totalItems += catTotal;
                checkedItems += catChecked;

                const categoryCard = document.createElement('div');
                categoryCard.className = "bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex flex-col justify-between transition hover:shadow-md";

                let itemsHtml = '';
                if (catGroup.items.length === 0) {
                    itemsHtml = `<p class="text-xs text-slate-400 italic py-2">此分類內尚無物品</p>`;
                } else {
                    itemsHtml = catGroup.items.map(item => `
                        <div class="flex items-center justify-between p-2 rounded-xl hover:bg-slate-50 transition group">
                            <label class="flex items-center space-x-3 cursor-pointer w-full select-none">
                                <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleItem('${item.id}')" class="w-4 h-4 text-brand-600 rounded border-slate-300 focus:ring-brand-500 transition">
                                <span class="text-sm ${item.checked ? 'item-checked' : 'text-slate-700 font-medium'}">${escapeHtml(item.name)}</span>
                            </label>
                            <button onclick="deleteItem('${item.id}')" class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-rose-500 p-1 text-xs transition" title="刪除物品">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    `).join('');
                }

                categoryCard.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-3">
                            <div class="flex items-center space-x-2">
                                <div class="w-7 h-7 rounded-lg bg-brand-50 text-brand-600 flex items-center justify-center text-xs">
                                    <i class="fa-solid ${catGroup.icon || 'fa-folder'}"></i>
                                </div>
                                <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                                    <span>${escapeHtml(catGroup.category)}</span>
                                    <button onclick="renameCategory('${catIdx}')" class="text-slate-300 hover:text-brand-600 text-xs transition" title="修改分類名稱">
                                        <i class="fa-solid fa-pen"></i>
                                    </button>
                                </h3>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="text-xs text-slate-400 bg-slate-50 px-2 py-0.5 rounded-full border border-slate-100 font-medium">${catChecked}/${catTotal}</span>
                                <button onclick="deleteCategory('${catIdx}')" class="text-slate-300 hover:text-rose-500 text-xs p-1 transition" title="刪除分類">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                        <div class="space-y-1">
                            ${itemsHtml}
                        </div>
                    </div>
                `;

                container.appendChild(categoryCard);
            });

            const percent = totalItems === 0 ? 0 : Math.round((checkedItems / totalItems) * 100);
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-percent').innerText = `${percent}%`;
            document.getElementById('progress-count').innerText = `${checkedItems} / ${totalItems} 項目已準備完成`;
        }

        function promptAddNewCategory() {
            const name = prompt("請輸入新分類名稱 (例如: 攝影器材、寶寶用品):");
            if (name && name.trim()) {
                const trimmedName = name.trim();
                const currentList = packingData[currentMode];
                
                if (currentList.some(c => c.category === trimmedName)) {
                    showToast('該分類名稱已存在！', 'warning');
                    return;
                }

                currentList.push({
                    category: trimmedName,
                    icon: "fa-folder-open",
                    items: []
                });

                saveToLocalStorage();
                updateCategoryDropdown();
                renderList();
                showToast(`已成功新增分類「${trimmedName}」`, 'success');
            }
        }

        function renameCategory(index) {
            const currentList = packingData[currentMode];
            const oldCategory = currentList[index];
            if (!oldCategory) return;

            const newName = prompt("請輸入新的分類名稱:", oldCategory.category);
            if (newName && newName.trim() && newName.trim() !== oldCategory.category) {
                const trimmedName = newName.trim();
                oldCategory.category = trimmedName;
                saveToLocalStorage();
                updateCategoryDropdown();
                renderList();
                showToast(`分類名稱已變更為「${trimmedName}」`, 'success');
            }
        }

        function deleteCategory(index) {
            const currentList = packingData[currentMode];
            const cat = currentList[index];
            if (!cat) return;

            if (confirm(`確定要刪除整個【${cat.category}】分類及其內部所有項目嗎？`)) {
                currentList.splice(index, 1);
                saveToLocalStorage();
                updateCategoryDropdown();
                renderList();
                showToast(`已刪除【${cat.category}】分類`, 'info');
            }
        }

        function clearAllChecks() {
            const currentList = packingData[currentMode];
            let hasChecked = false;
            currentList.forEach(cat => {
                cat.items.forEach(item => {
                    if (item.checked) {
                        item.checked = false;
                        hasChecked = true;
                    }
                });
            });

            if (hasChecked) {
                saveToLocalStorage();
                renderList();
                showToast('已完成一鍵取消所有勾選！', 'success');
            } else {
                showToast('目前沒有勾選的項目喔', 'info');
            }
        }

        function resetToDefault() {
            if (confirm(`確定要把【${currentMode === 'domestic' ? '國內' : '國外'}旅遊清單】還原成預設狀態嗎？這會清除您自訂的內容！`)) {
                if (currentMode === 'domestic') {
                    packingData.domestic = JSON.parse(JSON.stringify(defaultDomesticList));
                } else {
                    packingData.foreign = JSON.parse(JSON.stringify(defaultForeignList));
                }
                saveToLocalStorage();
                updateCategoryDropdown();
                renderList();
                showToast('清單已重置為預設狀態！', 'success');
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            let icon = 'fa-info-circle';
            let bgClass = 'bg-slate-800 text-white';

            if (type === 'success') {
                icon = 'fa-check-circle';
                bgClass = 'bg-teal-600 text-white';
            } else if (type === 'warning') {
                icon = 'fa-exclamation-triangle';
                bgClass = 'bg-amber-500 text-white';
            }

            toast.className = `flex items-center space-x-2 px-4 py-2.5 rounded-xl shadow-lg text-xs font-medium transform transition-all duration-300 opacity-0 translate-y-2 ${bgClass}`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i><span>${escapeHtml(message)}</span>`;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-y-2');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
