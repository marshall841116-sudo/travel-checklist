<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅遊攜帶清單 | PackSmart Dark Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        darkCard: '#1e293b',
                        darkBorder: '#334155',
                        tealBrand: {
                            50: '#f0fdfa',
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                            900: '#134e4a',
                        },
                        accentSky: {
                            400: '#38bdf8',
                            500: '#0ea5e9',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        .checkbox-custom:checked + label .checkmark-icon {
            opacity: 1;
            transform: scale(1);
        }
        .checkbox-custom:checked + label span.item-text {
            text-decoration: line-through;
            color: #64748b;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between pb-12 bg-slate-900">

    <!-- Header / Navbar -->
    <header class="bg-slate-800/90 backdrop-blur-md border-b border-slate-700/80 sticky top-0 z-30 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-start">
                <div class="flex items-center gap-3">
                    <div class="bg-gradient-to-tr from-tealBrand-600 to-accentSky-500 text-white p-2.5 rounded-2xl shadow-lg shadow-tealBrand-900/40">
                        <i class="fa-solid fa-plane-departure text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold bg-gradient-to-r from-tealBrand-400 to-accentSky-400 bg-clip-text text-transparent">
                            PackSmart 清單
                        </h1>
                        <p class="text-xs text-slate-400">智慧旅途打包管理助手</p>
                    </div>
                </div>

                <!-- Action Buttons: Import / Export -->
                <div class="flex gap-1.5 sm:hidden">
                    <button onclick="exportJSON()" title="備份匯出" class="p-2 text-slate-400 hover:text-white bg-slate-700/50 rounded-xl border border-slate-600/50">
                        <i class="fa-solid fa-download text-xs"></i>
                    </button>
                    <button onclick="triggerImport()" title="匯入備份" class="p-2 text-slate-400 hover:text-white bg-slate-700/50 rounded-xl border border-slate-600/50">
                        <i class="fa-solid fa-upload text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- Tab Buttons: Domestic vs International & Backup -->
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <div class="bg-slate-900/80 p-1 rounded-xl flex gap-1 flex-1 sm:flex-initial border border-slate-700/60">
                    <button id="tab-domestic" onclick="switchTab('domestic')" 
                        class="flex-1 sm:flex-initial px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-map-pin"></i> 國內旅遊
                    </button>
                    <button id="tab-international" onclick="switchTab('international')" 
                        class="flex-1 sm:flex-initial px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-earth-americas"></i> 國外旅遊
                    </button>
                </div>

                <!-- Desktop Backup Controls -->
                <div class="hidden sm:flex items-center gap-1.5 pl-2 border-l border-slate-700">
                    <button onclick="exportJSON()" title="匯出 JSON 備份" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-xl border border-slate-700 text-xs font-medium transition flex items-center gap-1.5">
                        <i class="fa-solid fa-download"></i> 匯出
                    </button>
                    <button onclick="triggerImport()" title="匯入 JSON 備份" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-xl border border-slate-700 text-xs font-medium transition flex items-center gap-1.5">
                        <i class="fa-solid fa-upload"></i> 匯入
                    </button>
                    <input type="file" id="json-file-input" class="hidden" accept=".json" onchange="importJSON(event)">
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto px-4 pt-6 w-full flex-grow">

        <!-- Controls Header: Progress Bar & Search/Filter Toolbar -->
        <div class="bg-slate-800/80 backdrop-blur rounded-2xl p-5 mb-6 shadow-xl border border-slate-700/70">
            <!-- Progress Section -->
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-2">
                    <span class="text-sm font-semibold text-slate-200" id="progress-title">國內旅遊打包進度</span>
                    <span id="progress-badge" class="bg-tealBrand-900/60 text-tealBrand-400 text-xs font-medium px-2.5 py-0.5 rounded-full border border-tealBrand-500/30">0/0 完成</span>
                </div>
                <span id="progress-percentage" class="text-lg font-bold text-tealBrand-400">0%</span>
            </div>
            
            <!-- Progress Track -->
            <div class="w-full bg-slate-900 rounded-full h-3.5 overflow-hidden p-0.5 border border-slate-700/80 mb-5">
                <div id="progress-fill" class="bg-gradient-to-r from-tealBrand-500 to-accentSky-500 h-full rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
            </div>

            <!-- Search Bar & Filters -->
            <div class="flex flex-col sm:flex-row gap-3 items-center justify-between border-t border-slate-700/60 pt-4">
                <!-- Search Input -->
                <div class="relative w-full sm:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="搜尋攜帶物品..." class="w-full bg-slate-900/90 text-xs sm:text-sm pl-8 pr-3 py-2 rounded-xl border border-slate-700 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-tealBrand-500 transition">
                </div>

                <!-- Status Filters -->
                <div class="flex items-center gap-1 bg-slate-900/90 p-1 rounded-xl border border-slate-700/80 w-full sm:w-auto">
                    <button id="filter-all" onclick="setFilter('all')" class="flex-1 sm:flex-initial px-3 py-1 rounded-lg text-xs font-medium transition text-white bg-slate-700">全部</button>
                    <button id="filter-pending" onclick="setFilter('pending')" class="flex-1 sm:flex-initial px-3 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition">未完成</button>
                    <button id="filter-completed" onclick="setFilter('completed')" class="flex-1 sm:flex-initial px-3 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition">已完成</button>
                </div>
            </div>

            <!-- Action Toolbar -->
            <div class="mt-4 pt-3 border-t border-slate-700/40 flex flex-wrap justify-between items-center gap-2">
                <div class="flex gap-2 w-full sm:w-auto">
                    <button onclick="clearAllChecks()" class="flex-1 sm:flex-initial px-3.5 py-2 rounded-xl bg-slate-700/50 hover:bg-slate-700 border border-slate-600/60 text-slate-300 font-medium transition flex items-center justify-center gap-1.5 active:scale-95 text-xs">
                        <i class="fa-solid fa-rotate-left text-slate-400"></i> 一鍵清除勾選
                    </button>
                    <button onclick="promptAddCategory()" class="flex-1 sm:flex-initial px-3.5 py-2 rounded-xl bg-tealBrand-600 hover:bg-tealBrand-500 text-white font-medium transition flex items-center justify-center gap-1.5 shadow-md shadow-tealBrand-900/30 active:scale-95 text-xs">
                        <i class="fa-solid fa-plus"></i> 新增分類
                    </button>
                </div>
                <button onclick="confirmResetToDefault()" class="text-xs text-slate-500 hover:text-rose-400 transition-colors py-1 flex items-center gap-1 ml-auto sm:ml-0">
                    <i class="fa-solid fa-trash-arrow-up"></i> 還原目前版本預設
                </button>
            </div>
        </div>

        <!-- Categories Container -->
        <div id="categories-container" class="space-y-5">
            <!-- Dynamically populated categories -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-12 bg-slate-800/50 rounded-2xl border border-dashed border-slate-700 px-4">
            <div class="w-16 h-16 bg-slate-800 text-tealBrand-400 rounded-full flex items-center justify-center mx-auto mb-3 border border-slate-700">
                <i class="fa-solid fa-box-open text-2xl"></i>
            </div>
            <h3 class="text-base font-bold text-slate-300 mb-1">找不到相關項目或分類</h3>
            <p class="text-slate-500 text-xs mb-4">嘗試修改搜尋關鍵字、切換篩選條件或新增分類。</p>
            <div class="flex justify-center gap-3">
                <button onclick="promptAddCategory()" class="px-4 py-2 bg-tealBrand-600 text-white text-xs font-medium rounded-xl hover:bg-tealBrand-500 transition">新增分類</button>
                <button onclick="resetToDefault()" class="px-4 py-2 bg-slate-700 text-slate-300 text-xs font-medium rounded-xl hover:bg-slate-600 transition">載入預設資料</button>
            </div>
        </div>

    </main>

    <!-- Modal Box -->
    <div id="modal-backdrop" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl transform transition-all scale-95 opacity-0" id="modal-box">
            <h3 id="modal-title" class="text-base font-bold text-slate-100 mb-2">標題</h3>
            <p id="modal-desc" class="text-xs text-slate-400 mb-4">內容描述文字</p>
            <div id="modal-input-container" class="mb-4 hidden">
                <input type="text" id="modal-input" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-slate-200 focus:outline-none focus:border-tealBrand-500 text-sm" placeholder="請輸入...">
            </div>
            <div class="flex justify-end gap-2.5">
                <button id="modal-btn-cancel" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-700 text-slate-300 hover:bg-slate-700 font-medium text-xs transition">取消</button>
                <button id="modal-btn-confirm" class="px-4 py-2 rounded-xl bg-tealBrand-600 hover:bg-tealBrand-500 text-white font-medium text-xs transition shadow-md">確認</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-700 text-slate-200 text-xs px-4 py-2.5 rounded-xl shadow-xl z-50 opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2">
        <i id="toast-icon" class="fa-solid fa-circle-check text-tealBrand-400"></i>
        <span id="toast-msg">操作成功</span>
    </div>

    <footer class="mt-12 text-center text-xs text-slate-500">
        <p>© PackSmart Travel Checklist - 暗黑簡約版</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Preset Standard Defaults
        const DEFAULT_DATA = {
            domestic: [
                {
                    id: 'dom_cat_1',
                    name: '重要證件與隨身卡片',
                    items: [
                        { id: 'item_1', name: '身分證 / 健保卡', checked: false },
                        { id: 'item_2', name: '駕照 / 汽機車執照', checked: false },
                        { id: 'item_3', name: '現金 / 常用信用卡', checked: false },
                        { id: 'item_4', name: '家門鑰匙 / 車鑰匙', checked: false }
                    ]
                },
                {
                    id: 'dom_cat_2',
                    name: '3C 設備與線材',
                    items: [
                        { id: 'item_5', name: '智慧型手機', checked: false },
                        { id: 'item_6', name: '充電線 / 多孔充電頭', checked: false },
                        { id: 'item_7', name: '行動電源 (PowerBank)', checked: false },
                        { id: 'item_8', name: '無線藍芽耳機', checked: false }
                    ]
                },
                {
                    id: 'dom_cat_3',
                    name: '個人盥洗與衣物',
                    items: [
                        { id: 'item_9', name: '替換衣物 / 內衣褲', checked: false },
                        { id: 'item_10', name: '個人牙刷牙膏 / 盥洗套組', checked: false },
                        { id: 'item_11', name: '護膚保養品 / 防曬乳', checked: false }
                    ]
                }
            ],
            international: [
                {
                    id: 'int_cat_1',
                    name: '國外必備重點證件',
                    items: [
                        { id: 'item_101', name: '護照 (檢查效期>6個月)', checked: false },
                        { id: 'item_102', name: '目的國簽證 / 電子簽列印本', checked: false },
                        { id: 'item_103', name: '機票確認單 / 飯店預約單', checked: false },
                        { id: 'item_104', name: '外幣現金 / 雙幣信用卡', checked: false }
                    ]
                },
                {
                    id: 'int_cat_2',
                    name: '國外通訊與插座',
                    items: [
                        { id: 'item_106', name: '網卡 (SIM/eSIM) / 退卡針', checked: false },
                        { id: 'item_107', name: '萬國轉接頭', checked: false },
                        { id: 'item_108', name: '行動電源 (放隨身行李登機)', checked: false }
                    ]
                },
                {
                    id: 'int_cat_3',
                    name: '搭機與常備藥品',
                    items: [
                        { id: 'item_110', name: '飛行頸枕 / 遮光眼罩 / 耳塞', checked: false },
                        { id: 'item_112', name: '個人常備藥 (感冒/腸胃/止痛藥)', checked: false }
                    ]
                }
            ]
        };

        // App State
        let currentTab = 'domestic'; 
        let currentFilter = 'all'; // 'all', 'pending', 'completed'
        let searchQuery = '';
        let appData = { domestic: [], international: [] };

        // Initial setup
        window.addEventListener('DOMContentLoaded', () => {
            loadDataFromStorage();
            switchTab('domestic');
        });

        // Storage Operations
        function loadDataFromStorage() {
            const saved = localStorage.getItem('packsmart_dark_checklist_data');
            if (saved) {
                try {
                    appData = JSON.parse(saved);
                } catch (e) {
                    console.error("Storage corrupted, loading default", e);
                    appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                }
            } else {
                appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                saveDataToStorage();
            }
        }

        function saveDataToStorage() {
            localStorage.setItem('packsmart_dark_checklist_data', JSON.stringify(appData));
            updateProgress();
        }

        // Tab Switching
        function switchTab(tab) {
            currentTab = tab;
            const domTab = document.getElementById('tab-domestic');
            const intTab = document.getElementById('tab-international');
            const progressTitle = document.getElementById('progress-title');

            if (tab === 'domestic') {
                domTab.className = "flex-1 sm:flex-initial px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition bg-tealBrand-600 text-white shadow";
                intTab.className = "flex-1 sm:flex-initial px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition text-slate-400 hover:text-slate-200";
                progressTitle.textContent = "國內旅遊打包進度";
            } else {
                intTab.className = "flex-1 sm:flex-initial px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition bg-accentSky-500 text-white shadow";
                domTab.className = "flex-1 sm:flex-initial px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition text-slate-400 hover:text-slate-200";
                progressTitle.textContent = "國外旅遊打包進度";
            }

            renderCategories();
        }

        // Search & Filter Controllers
        function handleSearch(val) {
            searchQuery = val.trim().toLowerCase();
            renderCategories();
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            ['all', 'pending', 'completed'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filterType) {
                    btn.className = "flex-1 sm:flex-initial px-3 py-1 rounded-lg text-xs font-medium transition text-white bg-slate-700 shadow-sm";
                } else {
                    btn.className = "flex-1 sm:flex-initial px-3 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition";
                }
            });
            renderCategories();
        }

        // Main Render Logic
        function renderCategories() {
            const container = document.getElementById('categories-container');
            const emptyState = document.getElementById('empty-state');
            const categories = appData[currentTab] || [];

            container.innerHTML = '';
            let totalRenderedItems = 0;

            categories.forEach(cat => {
                // Filter Items based on search and status filter
                const filteredItems = cat.items.filter(item => {
                    const matchesSearch = item.name.toLowerCase().includes(searchQuery);
                    let matchesFilter = true;
                    if (currentFilter === 'pending') matchesFilter = !item.checked;
                    if (currentFilter === 'completed') matchesFilter = item.checked;
                    return matchesSearch && matchesFilter;
                });

                // Skip rendering empty categories when filtering or searching
                if ((searchQuery || currentFilter !== 'all') && filteredItems.length === 0) {
                    return;
                }

                totalRenderedItems += filteredItems.length;

                const catCard = document.createElement('div');
                catCard.className = "bg-slate-800/70 border border-slate-700/70 rounded-2xl p-5 shadow-lg transition hover:border-slate-600";

                const itemsCount = cat.items.length;
                const checkedCount = cat.items.filter(i => i.checked).length;

                catCard.innerHTML = `
                    <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-700/60">
                        <div class="flex items-center gap-2 flex-1 mr-2">
                            <i class="fa-solid fa-folder-open text-tealBrand-400"></i>
                            <h3 class="font-bold text-slate-100 text-sm sm:text-base flex-1 hover:text-tealBrand-400 cursor-pointer" onclick="promptEditCategory('${cat.id}')">
                                ${escapeHtml(cat.name)}
                            </h3>
                            <span class="text-xs px-2 py-0.5 rounded-full bg-slate-900/80 text-slate-400 font-normal border border-slate-700">
                                ${checkedCount}/${itemsCount}
                            </span>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="promptEditCategory('${cat.id}')" title="修改標題" class="p-1.5 text-slate-400 hover:text-tealBrand-400 rounded-lg hover:bg-slate-700 transition">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="confirmDeleteCategory('${cat.id}')" title="刪除分類" class="p-1.5 text-slate-400 hover:text-rose-400 rounded-lg hover:bg-slate-700 transition">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Items List -->
                    <div class="space-y-1.5 mb-3">
                        ${filteredItems.length === 0 ? '<p class="text-xs text-slate-500 py-2 text-center">無符合條件的項目</p>' : ''}
                        ${filteredItems.map(item => `
                            <div class="group flex items-center justify-between p-2 rounded-xl hover:bg-slate-900/40 transition border border-transparent hover:border-slate-700/50">
                                <div class="flex items-center gap-3 flex-1 min-w-0">
                                    <input type="checkbox" id="chk-${item.id}" class="checkbox-custom hidden" ${item.checked ? 'checked' : ''} onchange="toggleItemCheck('${cat.id}', '${item.id}')">
                                    <label for="chk-${item.id}" class="flex items-center gap-3 cursor-pointer w-full select-none truncate">
                                        <div class="w-5 h-5 rounded-md border-2 border-slate-600 flex items-center justify-center transition bg-slate-900 group-hover:border-tealBrand-400 flex-shrink-0">
                                            <i class="fa-solid fa-check text-xs text-tealBrand-400 checkmark-icon opacity-0 transition-opacity"></i>
                                        </div>
                                        <span class="item-text text-slate-200 text-xs sm:text-sm truncate font-medium transition">${escapeHtml(item.name)}</span>
                                    </label>
                                </div>
                                <div class="opacity-100 sm:opacity-0 group-hover:opacity-100 transition flex items-center gap-1 pl-2">
                                    <button onclick="promptEditItem('${cat.id}', '${item.id}')" class="p-1 text-slate-500 hover:text-tealBrand-400 transition">
                                        <i class="fa-solid fa-pen text-xs"></i>
                                    </button>
                                    <button onclick="deleteItem('${cat.id}', '${item.id}')" class="p-1 text-slate-500 hover:text-rose-400 transition">
                                        <i class="fa-solid fa-xmark text-sm"></i>
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Item Input Form -->
                    <form onsubmit="handleAddItem(event, '${cat.id}')" class="flex gap-2 pt-1">
                        <input type="text" id="input-new-item-${cat.id}" placeholder="新增攜帶物品..." class="flex-1 bg-slate-900/90 text-xs px-3 py-2 rounded-xl border border-slate-700 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-tealBrand-500 transition">
                        <button type="submit" class="px-3 py-2 bg-slate-700 hover:bg-tealBrand-600 text-slate-200 hover:text-white text-xs font-semibold rounded-xl transition flex items-center gap-1">
                            <i class="fa-solid fa-plus text-xs"></i> 新增
                        </button>
                    </form>
                `;

                container.appendChild(catCard);
            });

            if (categories.length === 0 || (searchQuery && totalRenderedItems === 0)) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }

            updateProgress();
        }

        // Calculate Global Progress
        function updateProgress() {
            const categories = appData[currentTab] || [];
            let total = 0;
            let checked = 0;

            categories.forEach(cat => {
                total += cat.items.length;
                checked += cat.items.filter(i => i.checked).length;
            });

            const percentage = total === 0 ? 0 : Math.round((checked / total) * 100);

            document.getElementById('progress-badge').textContent = `${checked}/${total} 完成`;
            document.getElementById('progress-percentage').textContent = `${percentage}%`;
            document.getElementById('progress-fill').style.width = `${percentage}%`;
        }

        // Checkbox & CRUD Operations
        function toggleItemCheck(catId, itemId) {
            const cat = appData[currentTab].find(c => c.id === catId);
            if (cat) {
                const item = cat.items.find(i => i.id === itemId);
                if (item) {
                    item.checked = !item.checked;
                    saveDataToStorage();
                    renderCategories();
                }
            }
        }

        function handleAddItem(e, catId) {
            e.preventDefault();
            const input = document.getElementById(`input-new-item-${catId}`);
            const val = input.value.trim();

            if (!val) return;

            const cat = appData[currentTab].find(c => c.id === catId);
            if (cat) {
                cat.items.push({
                    id: 'item_' + Date.now() + Math.random().toString(36).substr(2, 3),
                    name: val,
                    checked: false
                });
                saveDataToStorage();
                renderCategories();
                showToast("已成功新增項目");
            }
        }

        function deleteItem(catId, itemId) {
            const cat = appData[currentTab].find(c => c.id === catId);
            if (cat) {
                cat.items = cat.items.filter(i => i.id !== itemId);
                saveDataToStorage();
                renderCategories();
                showToast("已刪除項目");
            }
        }

        function promptEditItem(catId, itemId) {
            const cat = appData[currentTab].find(c => c.id === catId);
            if (!cat) return;
            const item = cat.items.find(i => i.id === itemId);
            if (!item) return;

            showModal({
                title: "編輯項目名稱",
                desc: "修改該攜帶物品名稱：",
                defaultValue: item.name,
                onConfirm: (newVal) => {
                    if (newVal.trim()) {
                        item.name = newVal.trim();
                        saveDataToStorage();
                        renderCategories();
                        showToast("已更新項目名稱");
                    }
                }
            });
        }

        function promptAddCategory() {
            showModal({
                title: "新增清單分類",
                desc: "請輸入分類標題（如：攝影器材、防曬用品）：",
                defaultValue: "",
                onConfirm: (catName) => {
                    if (catName.trim()) {
                        appData[currentTab].push({
                            id: 'cat_' + Date.now(),
                            name: catName.trim(),
                            items: []
                        });
                        saveDataToStorage();
                        renderCategories();
                        showToast("已新增分類");
                    }
                }
            });
        }

        function promptEditCategory(catId) {
            const cat = appData[currentTab].find(c => c.id === catId);
            if (!cat) return;

            showModal({
                title: "修改分類標題",
                desc: "請輸入新的分類名稱：",
                defaultValue: cat.name,
                onConfirm: (newName) => {
                    if (newName.trim()) {
                        cat.name = newName.trim();
                        saveDataToStorage();
                        renderCategories();
                        showToast("分類標題已更新");
                    }
                }
            });
        }

        function confirmDeleteCategory(catId) {
            const cat = appData[currentTab].find(c => c.id === catId);
            if (!cat) return;

            showModal({
                title: `刪除「${cat.name}」？`,
                desc: "警告：這將會一併刪除該分類下的所有包含項目。",
                showInput: false,
                onConfirm: () => {
                    appData[currentTab] = appData[currentTab].filter(c => c.id !== catId);
                    saveDataToStorage();
                    renderCategories();
                    showToast("分類已刪除");
                }
            });
        }

        function clearAllChecks() {
            const categories = appData[currentTab] || [];
            let count = 0;
            categories.forEach(cat => {
                cat.items.forEach(item => {
                    if (item.checked) count++;
                    item.checked = false;
                });
            });

            if (count === 0) {
                showToast("目前沒有被勾選的項目");
                return;
            }

            saveDataToStorage();
            renderCategories();
            showToast("已清除所有勾選狀態");
        }

        function confirmResetToDefault() {
            showModal({
                title: "還原預設清單？",
                desc: "這會重置目前頁面的所有分類與勾選記錄，確定還原？",
                showInput: false,
                onConfirm: () => resetToDefault()
            });
        }

        function resetToDefault() {
            appData[currentTab] = JSON.parse(JSON.stringify(DEFAULT_DATA[currentTab]));
            saveDataToStorage();
            renderCategories();
            showToast("已還原預設清單");
        }

        // Backup Export / Import
        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `packsmart_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchorElem);
            dlAnchorElem.click();
            dlAnchorElem.remove();
            showToast("已匯出清單備份 JSON");
        }

        function triggerImport() {
            document.getElementById('json-file-input').click();
        }

        function importJSON(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.domestic && imported.international) {
                        appData = imported;
                        saveDataToStorage();
                        renderCategories();
                        showToast("成功匯入清單資料！");
                    } else {
                        showToast("檔案格式不相符");
                    }
                } catch (err) {
                    showToast("讀取 JSON 檔案失敗");
                }
            };
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0]);
            }
        }

        // Modal Utility
        function showModal({ title, desc, defaultValue = "", showInput = true, onConfirm }) {
            const backdrop = document.getElementById('modal-backdrop');
            const box = document.getElementById('modal-box');
            const titleEl = document.getElementById('modal-title');
            const descEl = document.getElementById('modal-desc');
            const inputContainer = document.getElementById('modal-input-container');
            const inputEl = document.getElementById('modal-input');
            const confirmBtn = document.getElementById('modal-btn-confirm');

            titleEl.textContent = title;
            descEl.textContent = desc;

            if (showInput) {
                inputContainer.classList.remove('hidden');
                inputEl.value = defaultValue;
                setTimeout(() => inputEl.focus(), 100);
            } else {
                inputContainer.classList.add('hidden');
            }

            confirmBtn.onclick = () => {
                const val = inputEl.value;
                closeModal();
                if (onConfirm) onConfirm(val);
            };

            backdrop.classList.remove('hidden');
            setTimeout(() => {
                box.classList.remove('scale-95', 'opacity-0');
                box.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const backdrop = document.getElementById('modal-backdrop');
            const box = document.getElementById('modal-box');
            box.classList.remove('scale-100', 'opacity-100');
            box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => backdrop.classList.add('hidden'), 200);
        }

        // Toast Feedback
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 2200);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
